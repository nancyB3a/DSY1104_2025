<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--JQuery-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Consumo de API Meal</title>
    <!--JQuery para consumir API Meals-->
    <script type="text/javascript">
        $(document).ready(function() {
          /*Llamr servicio y mostrar los elementos en la tabla categoriasMeals
          cuando haga click en el botón -> cargo la info desde la API*/  
            $("#btnEnviar").click(function(){
                $.get("https://www.themealdb.com/api/json/v1/1/categories.php",
                    function(data){
                        //en data capturo todos los datos que retorna la API
                        $.each(data.categories, function(i,item){
                            //por cada elemento que leo agrego una nueva fila a la tabla
                            $("#categoriasMeals").append("<tr><td>"+item.idCategory+
                                "</td><td>" + item.strCategory+
                                "</td><td><img src='" +item.strCategoryThumb+"'>"+
                                "</td><td>" + item.strCategoryDescription+"</td></tr>"                
                            );
                        });
                    }
                );
            });
        });
    </script>
</head>

<body>
    <div class="container">
        <div class="row mb-3">
            <h3>Ejemplo: Traer datos Asíncronamente</h3>
        </div>
        <div class="row mb-3">
            <button type="button" class="btn btn-primary" id="btnEnviar">Traer Datos</button>
        </div>
        <div class="row mb-3">
            <table class="table table-bordered" id="categoriasMeals">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Imagen</th>
                        <th scope="col">Descripción</th>
                    </tr>
                </thead>                
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
