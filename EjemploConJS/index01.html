<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <title>Ejemplo con JS en HTML</title>
    <!--Acá escribo mi script Js-->
    <script type="text/javascript">
        //definir la función sumar
        function sumar() {
            //rescato desde el formulario num1 y num2
            var n1 = document.getElementById("num1").value;
            var n2 = document.getElementById("num2").value;
            //obtener el resultado de la suma
            var resultado = parseInt(n1)+parseInt(n2);
            alert("El resultado de la suma es: "+resultado);
        }
    </script>
    <!--fin de script JS-->
</head>

<body>
    <div class="container">
        <br>
        <h1>Ejemplo con JS en el HTML</h1>
        <br>
        <div class="mb-3">
            <label for="num1" class="form-label">Número 1</label>
            <input type="number" class="form-control" id="num1" placeholder="Ingrese valor 1">
        </div>
        <div class="mb-3">
            <label for="num2" class="form-label">Número 2</label>
            <input type="number" class="form-control" id="num2" placeholder="Ingrese valor 2">
        </div>
        <div class="d-grid gap-2">
            <button class="btn btn-primary" type="button" onclick="sumar()">Sumar</button>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
